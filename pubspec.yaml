name: saku_apps
description: "Saku — Personal Finance Tracker. Record. Monitor. Save. All in your pocket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage (Hive Community Edition — maintained fork of hive)
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.4

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Settings features
  share_plus: ^10.0.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

  # Icons
  hugeicons: ^1.1.7

  # Animations
  lottie: ^3.1.3

dependency_overrides:
  # hugeicons requires flutter_svg ^2.0.9; lock to the last stable 2.0.x.
  flutter_svg: ">=2.0.10+1 <2.1.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.10.0

  # Generates platform launcher icons (Android mipmap + iOS AppIcon.appiconset)
  # from a single 1024x1024 master in assets/app_icons/App_Store_1024x1024.png.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/app_icons/
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# -----------------------------------------------------------------------------
# Launcher icon configuration
#
#   Source of truth:  assets/app_icons/App_Store_1024x1024.png  (1024x1024 PNG)
#
# Run after any change to the source image:
#   dart run flutter_launcher_icons
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icons/App_Store_1024x1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Adaptive icon (Android 8+): white background, foreground is the same glyph.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icons/App_Store_1024x1024.png"
