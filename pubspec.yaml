name: saku_apps
description: "Saku — Personal Finance Tracker. Record. Monitor. Save. All in your pocket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage (Hive Community Edition — maintained fork of hive)
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.4

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icons/
    - assets/icons/
    - assets/images/
